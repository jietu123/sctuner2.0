paths:
  sc_expr: unused
  sc_meta: null
  st_expr: null
  st_meta: null
qc:
  sc_min_genes: 0
  sc_max_genes: 100000
  sc_max_mt: 100
  st_min_genes: 0
  st_max_genes: Inf
  st_max_mt: 100
gene_filter:
  min_cells_sc: 0
  min_cells_st: 0
stage3:
  strong_th: 0.7
  weak_th: 0.4
  st_cluster_k: 0
  unknown_floor: 0.3
  min_cells_rare_type: 20
  eps: 1.0e-08
  plugin_genes_path: data/processed/high/cytospace_fig2j_stage3a_probe/stage1_preprocess/hvg_genes.txt
  enable_mismatch_detection: true
  score_method: aggregate_test
  apply_mismatch_to_relabel: false
  drop_unknown: true
  auto_missing_detection:
    enable: true
    method: adaptive_low_support
    min_cells: 50
    support_th: 0.65
    categories: [weak, unsupported]
    robust_z_th: -2.0
    soft_z_th: -0.9
    require_confirmation: true
    confirmation_use_masked_missing: true
    confirmation_use_marker_identity: true
    confirmation_marker_identity_z_th: -1.5
    confirmation_marker_support_score_th: 0.5
    max_fraction_types: 0.4
    max_types: 3
    action: mark_unknown
  masked_missing_detection:
    enable: true
    apply_to_auto_missing: true
    neighbor_cosine_th: 0.90
    marker_top_n: 20
    min_identity_markers: 3
    min_marker_specificity: 1.2
    min_marker_type_mean: 0.001
    min_marker_st_detect_frac: 0.005
    st_presence_quantile: 0.90
    identity_z_th: -0.8
    pressure_z_th: 1.0
  marker_identity_diagnostics:
    enable: true
    marker_top_n: 50
    min_identity_markers: 5
    min_all_specificity: 1.5
    min_neighbor_specificity: 1.2
    min_marker_type_mean: 0.001
    min_marker_st_detect_frac: 0.005
    st_presence_quantile: 0.90
    depleted_z_th: -0.9
stage3b:
  fdr: 0.05
  n_calibration: 0
  n_spatial_permutations: 50
  random_seed: 42
  expression_scale: linear
  sc_profile_scale: linear
  max_genes: 250
storage:
  group: high
